# E2E overlay — production-mode services with seeded database.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.e2e.yml \
#     -f docker-compose.stack.yml up -d --build --wait
#   docker compose -f docker-compose.yml -f docker-compose.e2e.yml \
#     -f docker-compose.stack.yml run --rm backend-seeder
#   docker compose -f docker-compose.yml -f docker-compose.e2e.yml \
#     -f docker-compose.stack.yml run --rm playwright
#   docker compose -f docker-compose.yml -f docker-compose.e2e.yml \
#     -f docker-compose.stack.yml down -v

services:
  # ── Production-mode app services ───────────
  frontend:
    build:
      target: production
    environment:
      # Server-side ISR/SSR fetches need an absolute URL to reach the
      # backend via nginx. The Docker network alias on the nginx
      # service resolves the real domain to the nginx container, so the
      # TLS cert's SAN list matches. Deno ignores NODE_TLS_REJECT_UNAUTHORIZED,
      # so we also pass --unsafely-ignore-certificate-errors via the
      # command override below as belt-and-suspenders against the dev
      # self-signed CA.
      - NUXT_PUBLIC_API_BASE_URL=https://${APP_DOMAIN:-finalcut.test}
    command:
      ["run", "--allow-net", "--allow-read", "--allow-env",
       "--unsafely-ignore-certificate-errors", ".output/server/index.mjs"]
    # The base image's healthcheck fetches `/`, which triggers SSR
    # (useMovies() on the home page) and thus depends on nginx being
    # up. nginx in turn depends on frontend being healthy — a cycle.
    # For E2E we only need to know the Deno server has bound the
    # port; the real readiness is covered by subsequent test steps.
    healthcheck:
      test: ["CMD", "deno", "eval", "const s = await Deno.connect({ hostname: '127.0.0.1', port: 3000 }); s.close();"]
      interval: 5s
      retries: 20
      timeout: 3s
      start_period: 15s

  backend:
    build:
      target: production
    volumes:
      # Raise FPM worker headroom so parallel Playwright workers don't
      # saturate the default 5-child pool, which otherwise causes Nuxt
      # ISR renders to time out and cache incomplete pages.
      - ./backend/php-fpm-e2e.conf:/usr/local/etc/php-fpm.d/zz-e2e.conf:ro
    environment:
      # Fixed, intentionally-public test key — APP_ENV=testing against the
      # throwaway final_cut_test DB. NOT a leaked secret; never used where
      # APP_ENV=production. CI may override via the APP_KEY env var.
      - APP_KEY=${APP_KEY:-base64:Ktj1Q0ICzknLQ4jhpPOAPELk7cHPk7LPJSImpY6sDjc=}
      - APP_ENV=testing
      - APP_DEBUG=true
      - APP_URL=https://${APP_DOMAIN:-finalcut.test}
      - FRONTEND_URL=https://${APP_DOMAIN:-finalcut.test}
      - SANCTUM_STATEFUL_DOMAINS=${APP_DOMAIN:-finalcut.test}
      - DB_DATABASE=${DB_TEST_DATABASE:-final_cut_test}
      # Effectively disable API rate limiting. Parallel Playwright workers
      # drive SSR fetches from a single frontend-container IP; the 60 rpm
      # default otherwise throttles Nuxt renders and produces 429 pages.
      - API_THROTTLE=10000,1
      # The named `auth`/`public-lookup` limiters (P0) are otherwise tripped by
      # the e2e suite logging in as the same test user many times from one IP.
      # Relaxed here only; production keeps the secure 5/20/30 defaults.
      - THROTTLE_AUTH_PER_EMAIL=10000
      - THROTTLE_AUTH_PER_IP=10000
      - THROTTLE_PUBLIC_LOOKUP=10000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      interval: 5s
      retries: 10

  # ── One-shot seeder (runs migrate:fresh --seed, then exits) ──
  # Profile prevents `up` from starting this; use `run --rm backend-seeder`.
  backend-seeder:
    profiles: [tools]
    build:
      context: ./backend
      target: e2e-seeder
    volumes:
      - ./redis/certs/ca.pem:/tls/redis/ca.pem:ro
      - ./postgres/certs/ca.pem:/tls/postgres/ca.pem:ro
    environment:
      # Fixed, intentionally-public test key — APP_ENV=testing against the
      # throwaway final_cut_test DB. NOT a leaked secret; never used where
      # APP_ENV=production. CI may override via the APP_KEY env var.
      - APP_KEY=${APP_KEY:-base64:Ktj1Q0ICzknLQ4jhpPOAPELk7cHPk7LPJSImpY6sDjc=}
      - APP_ENV=testing
      - APP_DEBUG=true
      - DB_CONNECTION=${DB_CONNECTION:-pgsql}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_DATABASE=${DB_TEST_DATABASE:-final_cut_test}
      - DB_USERNAME=${DB_USERNAME:-final_cut}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - DB_SSLMODE=${DB_SSLMODE:-verify-full}
      - DB_SSLROOTCERT=${DB_SSLROOTCERT:-/tls/postgres/ca.pem}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_USERNAME=${REDIS_USERNAME:-app}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redissecret}
      - REDIS_SCHEME=${REDIS_SCHEME:-tls}
      - REDIS_TLS_CA_CERT=/tls/redis/ca.pem
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Disable fail2ban for e2e ───────────────
  fail2ban:
    deploy:
      replicas: 0

  # ── Exclude the queue worker / scheduler from the e2e stack ────────────────
  # The Playwright e2e suite drives the frontend against the running stack; it
  # never depends on background-queue processing or scheduled commands (the
  # original e2e passed with these running, unhealthchecked, against the
  # throwaway test DB). The P2 production liveness healthchecks (pgrep) made
  # `docker compose up --wait` gate on `backend-worker`, and a disabled
  # healthcheck makes `--wait` error with "no healthcheck configured". Setting
  # replicas to 0 removes them from the `--wait` set entirely (same pattern as
  # fail2ban above). The production healthchecks in docker-compose.yml are
  # unchanged.
  backend-worker:
    deploy:
      replicas: 0

  backend-scheduler:
    deploy:
      replicas: 0

  # ── Faster healthchecks + permissive rate limits ────
  nginx:
    volumes:
      - ./nginx/nginx.e2e.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      interval: 5s
      retries: 10
      start_period: 10s

  postgres:
    healthcheck:
      interval: 5s
      retries: 10
      start_period: 10s

  redis:
    healthcheck:
      interval: 5s
      retries: 10
      start_period: 5s

  # ── Playwright ─────────────────────────────
  # Profile prevents `up` from starting this; use `run --rm playwright`.
  playwright:
    profiles: [tools]
    image: mcr.microsoft.com/playwright:v1.58.0-noble
    working_dir: /app
    volumes:
      - ./e2e:/app
    depends_on:
      nginx:
        condition: service_healthy
    environment:
      - BASE_URL=https://${APP_DOMAIN:-finalcut.test}
      - CI=true
      - NODE_TLS_REJECT_UNAUTHORIZED=0
    command:
      - sh
      - -c
      - npm ci && npx playwright test
