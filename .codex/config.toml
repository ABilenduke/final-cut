# Project-local cowork/Codex manifest for Final Cut.
# This file is committed with the repo; keep user secrets and personal auth in global config.

project_name = "Final Cut"
source_instruction_file = "CLAUDE.md"
primary_instruction_file = "AGENTS.md"
agent_manifest = ".codex/agents.toml"
skills_manifest = ".codex/skills.toml"
default_verification = "make test"
instructions = "AGENTS.md"
model = "gpt-5.5"

# Workspace root is inferred from the directory hosting this config so the
# manifest stays portable across machines and CI. Per-user paths (e.g. extra
# writable_roots) belong in an untracked local override, not this committed file.
[sandbox]
mode = "workspace-write"
approval_policy = "on-request"
writable_roots = ["/tmp"]

[commands]
setup = "make certs && make up"
test_all = "make test"
test_backend = "make test-backend"
test_backend_unit = "make test-backend-unit"
test_backend_feature = "make test-backend-feature"
test_frontend = "make test-frontend"
test_e2e = "make e2e"
admin_test = "make admin-test"
admin_assets = "make admin-filament-assets"
