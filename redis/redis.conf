# Redis Production Configuration
# ==============================

# Network
bind 0.0.0.0
port 0
tls-port 6379
tcp-backlog 511
timeout 300
tcp-keepalive 60

# TLS
tls-cert-file /etc/redis/tls/server.pem
tls-key-file /etc/redis/tls/server.key
tls-ca-cert-file /etc/redis/tls/ca.pem
tls-auth-clients no

# Security
protected-mode yes
aclfile /etc/redis/users.acl

# Disable dangerous commands
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command DEBUG ""
rename-command CONFIG ""

# Memory
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence - AOF (Append Only File)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Persistence - RDB snapshots
save 900 1
save 300 10
save 60 10000
dbfilename dump.rdb
dir /data
rdbcompression yes
rdbchecksum yes

# Logging
loglevel notice
logfile ""

# Connection limits
maxclients 100

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Disable Lua script time limit bypass
lua-time-limit 5000

# Latency monitoring
latency-monitor-threshold 100

# Do not expose Redis info to unauthenticated clients
always-show-logo no
