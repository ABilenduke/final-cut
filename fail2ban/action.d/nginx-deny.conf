# Ban/unban by writing nginx "deny" directives to a shared volume.
# Nginx includes this file and blocks banned IPs at the http level.
#
# After each ban/unban we signal nginx to reload via the Docker socket.
# The fail2ban container must mount /var/run/docker.sock and have curl
# installed (crazymax/fail2ban includes it).
#
# Requires:
#   - nginx-deny volume shared between fail2ban and nginx containers
#   - /var/run/docker.sock:ro mounted into fail2ban

[Definition]

actionstart = touch /etc/fail2ban/nginx-deny/banned-ips.conf

actionstop  =

actionban   = echo "deny <ip>;" >> /etc/fail2ban/nginx-deny/banned-ips.conf
              curl -sf --unix-socket /var/run/docker.sock -X POST "http://localhost/containers/nginx/kill?signal=HUP" || true

actionunban = sed -i '/deny <ip>;/d' /etc/fail2ban/nginx-deny/banned-ips.conf
              curl -sf --unix-socket /var/run/docker.sock -X POST "http://localhost/containers/nginx/kill?signal=HUP" || true
