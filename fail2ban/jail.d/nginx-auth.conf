# ──────────────────────────────────────────────
# Auth endpoint jail — stricter brute-force protection
# Watches /api/login, /api/register, /api/forgot-password
# Ban after 5 failures in 60s, ban lasts 24 hours
# ──────────────────────────────────────────────
[nginx-auth]
enabled  = true
filter   = nginx-auth
logpath  = /var/log/nginx/access.log
findtime = 60
maxretry = 5
bantime  = 86400
action   = nginx-deny
