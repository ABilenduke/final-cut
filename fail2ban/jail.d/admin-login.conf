# ──────────────────────────────────────────────
# Admin login jail — brute-force protection for the Filament panel
#
# Watches the dedicated `admin_auth_events` log emitted by
# backend/app/Providers/AppServiceProvider.php's Failed::class listener.
# 5 failures in 10 minutes → 24-hour ban via the existing `nginx-deny`
# action (writes a deny directive into the nginx-deny shared volume and
# signals nginx HUP via docker.sock — same path as the other admin jails).
#
# v1 is IPv4-only. Adding IPv6 ingress requires a parallel
# ip6tables-multiport jail and a dual-stack-aware nginx-deny variant.
# ──────────────────────────────────────────────
[admin-login]
enabled  = true
filter   = admin-login
logpath  = /var/log/admin/admin-auth-events.log
findtime = 600
maxretry = 5
bantime  = 86400
action   = nginx-deny
