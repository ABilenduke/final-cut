# ──────────────────────────────────────────────
# General nginx jail — catches repeated 4xx errors
# Ban after 10 failures in 60s, ban lasts 1 hour
# ──────────────────────────────────────────────
[nginx-4xx]
enabled  = true
filter   = nginx-4xx
logpath  = /var/log/nginx/access.log
findtime = 60
maxretry = 10
bantime  = 3600
action   = nginx-deny
