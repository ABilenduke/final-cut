# Match Monolog JsonFormatter output emitted by the `admin_auth_events`
# logging channel for failed admin login attempts. The "ip" field lives
# inside the "context" object. That `context` object itself is shallow —
# only scalar values (no nested objects), so the inner `[^}]*` scan is
# safe: the first `}` it hits closes the context, never an inner object.
# The outer JSON line still has additional siblings (`level_name`,
# `datetime`, etc.) after `context`, which is why the trailing `.*\}$`
# doesn't try to anchor on context's close brace.
#
# Contract: this filter is tightly coupled to the `Log::channel('admin_auth_events')`
# call site in backend/app/Providers/AppServiceProvider.php and the channel
# definition in backend/config/logging.php. CI regenerates the sample log
# from a live failed login and runs `fail2ban-regex` against it on every
# run, so Monolog version drift fails CI rather than silently breaking
# production banning.
[Definition]
failregex = ^\{.*"message":"Failed admin login".*"context":\{[^}]*"ip":"<HOST>"[^}]*\}.*\}$
ignoreregex =
