services:
  backend:
    environment:
      - APP_KEY=${APP_KEY:-base64:Y2ktdGVzdC1rZXktMzItYnl0ZXMtbG9uZy4uLi4=}
      - APP_ENV=testing
      - APP_DEBUG=true
      - APP_URL=https://${APP_DOMAIN:-finalcut.test}
      - FRONTEND_URL=https://${APP_DOMAIN:-finalcut.test}
      - SANCTUM_STATEFUL_DOMAINS=${APP_DOMAIN:-finalcut.test},nginx
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      interval: 5s
      retries: 10

  frontend:
    healthcheck:
      interval: 5s
      retries: 10

  nginx:
    healthcheck:
      interval: 5s
      retries: 10
      start_period: 10s

  postgres:
    healthcheck:
      interval: 5s
      retries: 10
      start_period: 10s

  redis:
    healthcheck:
      interval: 5s
      retries: 10
      start_period: 5s

  playwright:
    image: mcr.microsoft.com/playwright:v1.58.0-noble
    working_dir: /app
    volumes:
      - ./e2e:/app
    depends_on:
      nginx:
        condition: service_healthy
    environment:
      - BASE_URL=https://nginx
      - CI=true
      - NODE_TLS_REJECT_UNAUTHORIZED=0
    command:
      - sh
      - -c
      - npm install && npx playwright test
