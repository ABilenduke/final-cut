; PHP-FPM overrides for E2E — raises worker headroom so 8 parallel
; Playwright workers (each driving multiple concurrent API calls per
; page render) don't saturate the default pool and time out Nuxt's
; ISR/SSR fetches.
[www]
pm = dynamic
pm.max_children = 30
pm.start_servers = 5
pm.min_spare_servers = 3
pm.max_spare_servers = 10
