worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Hide server info ─────────────────────────
    server_tokens off;

    # ── Logging ──────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # ── Performance ──────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # ── Buffer limits (mitigate overflow attacks) ─
    client_body_buffer_size    16k;
    client_header_buffer_size  1k;
    large_client_header_buffers 4 8k;
    client_max_body_size       20M;

    # ── Rate limiting zones ──────────────────────
    # Map the rate-limit key so /_nuxt/ requests are excluded.
    # An empty key causes NGINX to skip tracking entirely.
    # In production /_nuxt/ serves content-hashed static assets that
    # browsers cache aggressively, so rate limiting adds no value.
    # In development this avoids 429s from Vite's burst of module requests.
    map $uri $general_rate_key {
        ~^/_nuxt/               "";
        ~^/__nuxt_devtools__/   "";
        default                 $binary_remote_addr;
    }

    # General requests: 10 req/s per IP (/_nuxt/ bypassed via map)
    limit_req_zone $general_rate_key zone=general:10m rate=10r/s;
    # API endpoints: 30 req/s per IP
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    # Login/auth: 5 req/min per IP (brute-force protection)
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

    limit_req_status 429;

    # ── Gzip ─────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss application/atom+xml image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
