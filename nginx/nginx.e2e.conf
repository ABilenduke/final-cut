# E2E nginx config — mirrors nginx.conf with rate limits relaxed to
# accommodate parallel Playwright workers hitting the stack from a
# single container IP. Keep structure in sync with nginx.conf; only
# the `Rate limiting zones` section should differ.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    client_body_buffer_size    16k;
    client_header_buffer_size  1k;
    large_client_header_buffers 4 8k;
    client_max_body_size       20M;

    # Rate limiting effectively disabled for E2E.
    # Playwright drives 8 parallel workers from a single container IP,
    # which trips prod limits (10 r/s general, 5 r/m auth) and produces
    # 429s that poison downstream assertions.
    map $uri $general_rate_key {
        default "";
    }

    limit_req_zone $general_rate_key       zone=general:10m     rate=10000r/s;
    limit_req_zone $binary_remote_addr     zone=api:10m         rate=10000r/s;
    limit_req_zone $binary_remote_addr     zone=auth:10m        rate=10000r/s;
    limit_req_zone $binary_remote_addr     zone=admin_login:10m rate=10000r/s;

    limit_req_status 429;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss application/atom+xml image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
