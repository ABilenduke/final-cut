name: PHPStan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check for PHP changes
        id: changes
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            BASE="${PR_BASE_SHA}"
          else
            BASE="${PUSH_BEFORE_SHA}"
          fi
          if git diff --name-only "$BASE" "$GITHUB_SHA" | grep -qE '^(backend/|\.github/workflows/backend-phpstan\.yml)'; then
            echo "php_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "php_changed=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
        working-directory: ${{ github.workspace }}

      - name: Setup PHP
        if: steps.changes.outputs.php_changed == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Install dependencies
        if: steps.changes.outputs.php_changed == 'true'
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run PHPStan
        if: steps.changes.outputs.php_changed == 'true'
        run: php -d memory_limit=512M vendor/bin/phpstan analyse --error-format=sarif > ../phpstan.sarif

      - name: Create empty SARIF (no PHP changes)
        if: steps.changes.outputs.php_changed == 'false'
        run: |
          cat > ../phpstan.sarif << 'SARIF'
          {"version":"2.1.0","$schema":"https://raw.githubusercontent.com/oasis-tcs/sarif-spec/main/sarif-2.1/schema/sarif-schema-2.1.0.json","runs":[{"tool":{"driver":{"name":"PHPStan","informationUri":"https://phpstan.org","rules":[]}},"results":[]}]}
          SARIF

      - name: Upload SARIF to GitHub
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: phpstan.sarif
