name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should_run: ${{ steps.filter.outputs.e2e }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            e2e:
              - 'frontend/**'
              - 'backend/**'
              - 'docker-compose.yml'
              - 'docker-compose.stack.yml'
              - 'docker-compose.ci.yml'
              - 'nginx/**'
              - 'postgres/**'
              - 'redis/**'
              - 'Makefile'
              - '.github/workflows/e2e.yml'

  e2e:
    name: E2E Tests
    needs: [changes]
    if: needs.changes.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Create environment files
        run: |
          cp .env.example .env
          cp backend/.env.example backend/.env

      - name: Generate TLS certificates
        run: make certs

      - name: Build and start services
        run: |
          docker compose -f docker-compose.yml -f docker-compose.stack.yml -f docker-compose.ci.yml \
            up -d --build --wait

      - name: Run migrations and seed database
        run: |
          docker compose -f docker-compose.yml -f docker-compose.stack.yml -f docker-compose.ci.yml \
            exec -T backend php artisan migrate:fresh --seed

      - name: Run Playwright E2E tests
        run: |
          docker compose -f docker-compose.yml -f docker-compose.stack.yml -f docker-compose.ci.yml \
            run --rm playwright

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Print service logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.stack.yml -f docker-compose.ci.yml \
            logs --tail=100

      - name: Tear down
        if: always()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.stack.yml -f docker-compose.ci.yml \
            down -v
