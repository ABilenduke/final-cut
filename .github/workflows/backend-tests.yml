name: Backend Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/backend-tests.yml'

  test:
    name: Backend Tests
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    permissions:
      contents: read

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: final_cut
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: final_cut_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U final_cut"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: final_cut_test
          DB_USERNAME: final_cut
          DB_PASSWORD: secret
          DB_SSLMODE: disable
        run: php artisan test --compact

      # Plan 09 contract: the Fail2ban admin-login filter regex and the
      # Monolog JsonFormatter shape emitted by the `admin_auth_events`
      # channel form a tightly-coupled pair. CI regenerates the sample on
      # every run from a real failed-login event and runs `fail2ban-regex`
      # against the freshly-written line — Monolog version drift fails CI
      # rather than silently breaking IP banning in production.
      #
      # All inputs to the run blocks below are static repository contents
      # (workflow file, fixture event_type) — no GitHub event payload.
      - name: Install fail2ban-regex
        run: sudo apt-get update && sudo apt-get install -y fail2ban
      - name: Regenerate and verify Fail2ban admin-login sample
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: final_cut_test
          DB_USERNAME: final_cut
          DB_PASSWORD: secret
          DB_SSLMODE: disable
        run: |
          set -euo pipefail

          rm -f storage/logs/admin-auth-events.log

          # Trigger the Failed::class listener with the admin guard so it
          # writes one JSON line to the dedicated channel. The credentials
          # below are a fixed static fixture, never user input.
          php artisan tinker --execute "event(new Illuminate\\Auth\\Events\\Failed('admin', null, ['email' => 'ci@example.com', 'password' => 'wrong']));"

          if [ ! -s storage/logs/admin-auth-events.log ]; then
            echo "::error::admin-auth-events.log was not written — has the listener in AppServiceProvider drifted?"
            exit 1
          fi

          tail -n 1 storage/logs/admin-auth-events.log > /tmp/admin-login.sample.log
          echo "--- regenerated sample ---"
          cat /tmp/admin-login.sample.log

          fail2ban-regex /tmp/admin-login.sample.log ../fail2ban/filter.d/admin-login.conf
