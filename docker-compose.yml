services:
  nginx:
    image: nginx:1.29.8-alpine
    container_name: nginx
    # Ensure banned-ips.conf exists before nginx reads the include.
    # Uses the default entrypoint (docker-entrypoint.sh) which handles
    # envsubst template processing for ${APP_DOMAIN}, then starts nginx.
    command:
      - /bin/sh
      - -c
      - |
        mkdir -p /etc/nginx/snippets
        touch /etc/nginx/banned/banned-ips.conf
        if [ -f /etc/nginx/certs/.domain ]; then
          CERT_DOMAIN=$$(cat /etc/nginx/certs/.domain)
          if [ "$$CERT_DOMAIN" != "$$APP_DOMAIN" ]; then
            echo ""
            echo "ERROR: Certificate was generated for '$$CERT_DOMAIN' but APP_DOMAIN is '$$APP_DOMAIN'."
            echo "Run 'make certs' to regenerate certificates for the new domain."
            echo ""
            exit 1
          fi
        elif [ -f /etc/nginx/certs/server.pem ]; then
          echo ""
          echo "WARNING: Certificates exist but have no domain marker."
          echo "Run 'make certs' to regenerate and stamp the current domain."
          echo ""
        fi
        # Render the Layer-1 admin IP allowlist block from ADMIN_IP_ALLOWLIST.
        # Contract:
        #   - APP_ENV=local                       → empty (allow all in dev)
        #   - APP_ENV=anything, list non-empty    → "allow CIDR; ... deny all;"
        #   - APP_ENV=anything, list empty        → "deny all;" (fail closed)
        # The Laravel AdminIpAllowlist middleware enforces the same posture
        # at Layer 2 so a misrendered template here never silently exposes
        # the admin panel.
        if [ "$$APP_ENV" = "local" ]; then
          ADMIN_ALLOWLIST_BLOCK=""
        elif [ -z "$$ADMIN_IP_ALLOWLIST" ]; then
          ADMIN_ALLOWLIST_BLOCK="deny all;"
        else
          ADMIN_ALLOWLIST_BLOCK=""
          IFS=','
          for cidr in $$ADMIN_IP_ALLOWLIST; do
            cidr=$$(echo "$$cidr" | tr -d '[:space:]')
            [ -n "$$cidr" ] && ADMIN_ALLOWLIST_BLOCK="$$ADMIN_ALLOWLIST_BLOCK allow $$cidr;"
          done
          unset IFS
          ADMIN_ALLOWLIST_BLOCK="$$ADMIN_ALLOWLIST_BLOCK deny all;"
        fi
        export ADMIN_ALLOWLIST_BLOCK
        /docker-entrypoint.sh nginx -g 'daemon off;'
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      # Filament publishes CSS/JS/fonts to backend/public; nginx needs to see
      # them to serve admin.${APP_DOMAIN} static assets directly. Read-only so
      # nginx can never mutate the Laravel application root.
      - ./backend/public:/var/www/html/public:ro
      - nginx-logs:/var/log/nginx
      - nginx-deny:/etc/nginx/banned
    environment:
      - APP_DOMAIN=${APP_DOMAIN:-finalcut.test}
      - APP_ENV=${APP_ENV:-local}
      - ADMIN_IP_ALLOWLIST=${ADMIN_IP_ALLOWLIST:-}
      - SSL_CERTIFICATE=${SSL_CERTIFICATE:-/etc/nginx/certs/server.pem}
      - SSL_CERTIFICATE_KEY=${SSL_CERTIFICATE_KEY:-/etc/nginx/certs/server.key}
      - NGINX_ENVSUBST_OUTPUT_DIR=/etc/nginx
    healthcheck:
      test: ["CMD-SHELL", "wget -qSO /dev/null http://127.0.0.1/ 2>&1 | grep -q 'HTTP/'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    # Expose nginx on the configured domain(s) via Docker DNS so sibling
    # containers (frontend SSR, playwright) can reach it with the real
    # hostname and match the TLS cert's SAN list. Without this, they'd
    # have to use the service name `nginx`, which fails both the TLS
    # cert check and Laravel's route-domain constraint.
    networks:
      default:
        aliases:
          - ${APP_DOMAIN:-finalcut.test}
          - admin.${APP_DOMAIN:-finalcut.test}

  # ── Fail2Ban sidecar ───────────────────────
  # Watches nginx access logs and bans abusive IPs by writing
  # nginx "deny" directives to a shared volume.
  #
  # Check ban status:
  #   docker compose exec fail2ban fail2ban-client status nginx-4xx
  #   docker compose exec fail2ban fail2ban-client status nginx-auth
  #
  # Manually unban an IP:
  #   docker compose exec fail2ban fail2ban-client set nginx-4xx unbanip <IP>
  #   docker compose exec fail2ban fail2ban-client set nginx-auth unbanip <IP>
  #
  # View all currently banned IPs:
  #   docker compose exec fail2ban fail2ban-client banned
  fail2ban:
    image: crazymax/fail2ban:latest
    container_name: fail2ban
    volumes:
      - nginx-logs:/var/log/nginx:ro
      # Read-only mount of the backend's storage/logs directory so the
      # admin-login jail can tail the dedicated `admin-auth-events.log`
      # written by the `admin_auth_events` Monolog channel. The jail file
      # references the path /var/log/admin/admin-auth-events.log inside
      # this container.
      - ./backend/storage/logs:/var/log/admin:ro
      - nginx-deny:/etc/fail2ban/nginx-deny
      - ./fail2ban/jail.d:/etc/fail2ban/jail.d:ro
      - ./fail2ban/filter.d:/etc/fail2ban/filter.d:ro
      - ./fail2ban/action.d:/etc/fail2ban/action.d:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - fail2ban-data:/var/lib/fail2ban
    environment:
      - TZ=${TZ:-UTC}
    healthcheck:
      test: ["CMD", "fail2ban-client", "ping"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      nginx:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:
      - NODE_ENV=${NODE_ENV:-production}
    container_name: frontend
    healthcheck:
      test: ["CMD", "deno", "eval", "await fetch('http://127.0.0.1:3000/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: backend
    volumes:
      - ./redis/certs/ca.pem:/tls/redis/ca.pem:ro
      - ./postgres/certs/ca.pem:/tls/postgres/ca.pem:ro
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - DB_CONNECTION=${DB_CONNECTION:-pgsql}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_DATABASE=${DB_DATABASE:-final_cut}
      - DB_USERNAME=${DB_USERNAME:-final_cut}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - DB_TEST_DATABASE=${DB_TEST_DATABASE:-final_cut_test}
      - DB_SSLMODE=${DB_SSLMODE:-verify-full}
      - DB_SSLROOTCERT=${DB_SSLROOTCERT:-/tls/postgres/ca.pem}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_USERNAME=${REDIS_USERNAME:-app}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redissecret}
      - REDIS_SCHEME=${REDIS_SCHEME:-tls}
      - REDIS_TLS_CA_CERT=/tls/redis/ca.pem
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$c=@fsockopen(\"127.0.0.1\",9000);if(!$$c)exit(1);fclose($$c);'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ── Queue worker ──────────────────────────────
  # Drains Redis queues for both customer-originated and admin-originated
  # jobs (mail, TMDB enrichment, NotifyCustomerOfShowtimeCancellation, etc.).
  # In v1 there is one default queue; v2 may split into named queues
  # (admin/customer/enrichment) so each worker pool can be scaled
  # independently. This service reuses the backend image — no separate
  # build context, no admin-specific Dockerfile.
  backend-worker:
    build:
      context: ./backend
    container_name: backend-worker
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=60"]
    volumes:
      - ./redis/certs/ca.pem:/tls/redis/ca.pem:ro
      - ./postgres/certs/ca.pem:/tls/postgres/ca.pem:ro
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - DB_CONNECTION=${DB_CONNECTION:-pgsql}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_DATABASE=${DB_DATABASE:-final_cut}
      - DB_USERNAME=${DB_USERNAME:-final_cut}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - DB_SSLMODE=${DB_SSLMODE:-verify-full}
      - DB_SSLROOTCERT=${DB_SSLROOTCERT:-/tls/postgres/ca.pem}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_USERNAME=${REDIS_USERNAME:-app}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redissecret}
      - REDIS_SCHEME=${REDIS_SCHEME:-tls}
      - REDIS_TLS_CA_CERT=/tls/redis/ca.pem
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # ── Scheduler ────────────────────────────────
  # Runs `php artisan schedule:work` so cron-style entries from
  # routes/console.php fire on time without an external cron container.
  # Currently registered: movies:enrich (hourly), activitylog:clean
  # (daily), outbox:dispatch (every minute, withoutOverlapping), and
  # outbox:prune (daily). Reuses the backend image.
  backend-scheduler:
    build:
      context: ./backend
    container_name: backend-scheduler
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - ./redis/certs/ca.pem:/tls/redis/ca.pem:ro
      - ./postgres/certs/ca.pem:/tls/postgres/ca.pem:ro
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - DB_CONNECTION=${DB_CONNECTION:-pgsql}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_DATABASE=${DB_DATABASE:-final_cut}
      - DB_USERNAME=${DB_USERNAME:-final_cut}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - DB_SSLMODE=${DB_SSLMODE:-verify-full}
      - DB_SSLROOTCERT=${DB_SSLROOTCERT:-/tls/postgres/ca.pem}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_USERNAME=${REDIS_USERNAME:-app}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redissecret}
      - REDIS_SCHEME=${REDIS_SCHEME:-tls}
      - REDIS_TLS_CA_CERT=/tls/redis/ca.pem
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  nginx-logs:
  nginx-deny:
  fail2ban-data:
