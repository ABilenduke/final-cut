include:
  - docker-compose.stack.yml

services:
  nginx:
    ports:
      - "6006:6006"
    depends_on:
      storybook:
        condition: service_healthy

  frontend:
    build:
      target: development
    volumes:
      - ./frontend:/app
      - frontend-deno-cache:/home/deno/.cache/deno
    environment:
      - NODE_ENV=development
    healthcheck:
      test: ["CMD", "deno", "eval", "await fetch('http://127.0.0.1:3000/')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s

  storybook:
    build:
      context: ./frontend
      target: development
    volumes:
      - ./frontend:/app
      - storybook-deno-cache:/home/deno/.cache/deno
    environment:
      - NODE_ENV=development
      - STORYBOOK=true
      - CACHE_DIR=/tmp/storybook-cache
    expose:
      - "6006"
    command: ["deno", "task", "storybook"]
    healthcheck:
      test: ["CMD", "deno", "eval", "await fetch('http://127.0.0.1:6006/')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  backend:
    build:
      target: development
    volumes:
      - ./backend:/var/www/html
      - backend-vendor:/var/www/html/vendor
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  playwright:
    image: mcr.microsoft.com/playwright:v1.58.0-noble
    profiles: ["e2e"]
    working_dir: /app
    volumes:
      - ./e2e:/app
    depends_on:
      nginx:
        condition: service_healthy
    environment:
      - BASE_URL=https://nginx
      - CI=true
      - NODE_TLS_REJECT_UNAUTHORIZED=0
    command:
      - sh
      - -c
      - npm install && npx playwright test

  mailpit:
    image: axllent/mailpit:v1.29.6
    ports:
      - "8025:8025"
      - "1025:1025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    restart: unless-stopped

volumes:
  backend-vendor:
  frontend-deno-cache:
  storybook-deno-cache:
