include:
  - docker-compose.stack.yml

services:
  frontend:
    build:
      target: development
      args:
        DEV_UID: ${DEV_UID:-1000}
        DEV_GID: ${DEV_GID:-1000}
    volumes:
      - ./frontend:/app
      # Shadow .nuxt/ with a named volume so Nuxt's build output and Nitro
      # cache live inside the container, not on the bind-mounted host
      # filesystem. Without this, fs-lite cache key collisions (file vs
      # directory at .nuxt/cache/nuxt/payload) persist across container
      # rebuilds because the host tree survives `make down/build/up`.
      - frontend-nuxt:/app/.nuxt
      - frontend-deno-cache:/home/devuser/.cache/deno
      - ./nginx/certs/ca.pem:/tls/nginx/ca.pem:ro
    environment:
      - NODE_ENV=development
      - NUXT_PUBLIC_API_BASE_URL=https://${APP_DOMAIN:-finalcut.test}
      - DENO_CERT=/tls/nginx/ca.pem
      - DEV_UID=${DEV_UID:-1000}
      - DEV_GID=${DEV_GID:-1000}
    healthcheck:
      # Run as devuser explicitly. The image USER defaults to root (the
      # entrypoint drops privs at runtime), but Docker healthchecks bypass
      # the entrypoint and execute as the image USER. Without runuser here,
      # the healthcheck would write Deno runtime artifacts into
      # frontend-deno-cache as root, blocking the actual dev process from
      # reading them on next start (EACCES).
      test: ["CMD", "runuser", "-u", "devuser", "--", "deno", "eval", "await fetch('http://127.0.0.1:3000/')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s

  backend:
    build:
      target: development
      args:
        DEV_UID: ${DEV_UID:-1000}
        DEV_GID: ${DEV_GID:-1000}
    volumes:
      - ./backend:/var/www/html
      - backend-vendor:/var/www/html/vendor
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DEV_UID=${DEV_UID:-1000}
      - DEV_GID=${DEV_GID:-1000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Worker + scheduler use the dev image target and bind-mount the source
  # tree the same way the backend service does, so code changes are picked
  # up on the next job/tick without a rebuild.
  backend-worker:
    build:
      target: development
      args:
        DEV_UID: ${DEV_UID:-1000}
        DEV_GID: ${DEV_GID:-1000}
    user: "${DEV_UID:-1000}:${DEV_GID:-1000}"
    volumes:
      - ./backend:/var/www/html
      - backend-vendor:/var/www/html/vendor
    environment:
      - APP_ENV=local
      - APP_DEBUG=true

  backend-scheduler:
    build:
      target: development
      args:
        DEV_UID: ${DEV_UID:-1000}
        DEV_GID: ${DEV_GID:-1000}
    user: "${DEV_UID:-1000}:${DEV_GID:-1000}"
    volumes:
      - ./backend:/var/www/html
      - backend-vendor:/var/www/html/vendor
    environment:
      - APP_ENV=local
      - APP_DEBUG=true

  playwright:
    image: mcr.microsoft.com/playwright:v1.58.0-noble
    profiles: ["e2e"]
    working_dir: /app
    volumes:
      - ./e2e:/app
    depends_on:
      nginx:
        condition: service_healthy
    environment:
      - BASE_URL=https://nginx
      - CI=true
      - NODE_TLS_REJECT_UNAUTHORIZED=0
    command:
      - sh
      - -c
      - npm install && npx playwright test

  mailpit:
    image: axllent/mailpit:v1.29.6
    container_name: mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    restart: unless-stopped

volumes:
  backend-vendor:
  frontend-deno-cache:
  frontend-nuxt:
